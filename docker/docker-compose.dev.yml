# ---------------------------------------------------------------------------
# Nur Infrastruktur fuer die lokale Entwicklung.
# Bot, API und Dashboard laufen dabei ausserhalb von Docker (`npm run dev`).
#
#   docker compose -f docker/docker-compose.dev.yml up -d
# ---------------------------------------------------------------------------
name: nexus-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-dev:
